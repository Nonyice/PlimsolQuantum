{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<section class="auth-page">

    <form class="glass-card auth-form" method="POST">

        <h2>Create Account</h2>

        <input
            type="text"
            name="fullname"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button class="btn-primary">

            Register

        </button>

    </form>

</section>

{% endblock %}
