{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="auth-page">

    <form class="glass-card auth-form" method="POST">

        <h2>Sign In</h2>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button class="btn-primary">
            Login
        </button>

        <p>

            Don't have an account?

            <a href="/auth/register">

                Register

            </a>

        </p>

    </form>

</section>

{% endblock %}
