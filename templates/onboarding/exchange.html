{% extends "base.html" %}

{% block title %}Connect Exchange{% endblock %}

{% block content %}

<div class="hero-card">

    <h1>Connect Your Exchange</h1>

    <p>PQI will use your encrypted API credentials.</p>

</div>

<div class="glass-card">

    <form method="POST">

        <div class="form-group">

            <label>Exchange</label>

            <select name="exchange">

                <option>Binance</option>
                <option>Bybit</option>
                <option>OKX</option>
                <option>KuCoin</option>

            </select>

        </div>

        <div class="form-group">

            <label>API Key</label>

            <input
                type="text"
                name="api_key">

        </div>

        <div class="form-group">

            <label>Secret Key</label>

            <input
                type="password"
                name="secret_key">

        </div>

        <div class="form-group">

            <label>

                <input
                    type="checkbox"
                    name="testnet">

                Use Testnet

            </label>

        </div>

        <br>

        <button
            class="btn-primary"
            type="submit">

            Validate Connection

        </button>

        <a
            href="{{ url_for('onboarding.subscription') }}"
            class="btn-primary">

            Continue

        </a>

    </form>

</div>

{% endblock %}
