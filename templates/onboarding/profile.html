{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

<div class="hero-card">
    <h1>Complete Your Profile</h1>
    <p>Tell us a little about yourself before continuing.</p>
</div>

<div class="glass-card">

    <form method="POST" action="{{ url_for('onboarding.profile') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="first_name">First Name</label>
            <input id="first_name" type="text" name="first_name"
                   value="{{ current_user.first_name or '' }}"
                   autocomplete="given-name" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input id="last_name" type="text" name="last_name"
                   value="{{ current_user.last_name or '' }}"
                   autocomplete="family-name" required>
        </div>

        <div class="form-group">
            <label for="country">Country</label>
            <input id="country" type="text" name="country"
                   value="{{ current_user.country or '' }}"
                   placeholder="Nigeria" autocomplete="country-name" required>
        </div>

        <div class="form-group">
            <label for="timezone">Timezone</label>
            <input id="timezone" type="text" name="timezone"
                   value="{{ current_user.timezone or 'Africa/Lagos' }}"
                   autocomplete="off" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Continue</button>
        </div>

    </form>

</div>

{% endblock %}
